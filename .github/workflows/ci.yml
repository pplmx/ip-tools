name: CI # Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

jobs:

    test:
        name: Test Suite (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
            -   uses: Swatinem/rust-cache@v2
            -   name: Run tests
                run: cargo test --all-features --workspace

    rustfmt:
        name: Rustfmt
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
                with:
                    components: rustfmt
            -   uses: Swatinem/rust-cache@v2
            -   name: Check formatting
                run: cargo fmt --all --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
                with:
                    components: clippy
            -   uses: Swatinem/rust-cache@v2
            -   name: Clippy check
                run: cargo clippy --all-targets --all-features --workspace -- -D warnings -W clippy::pedantic -W clippy::nursery

    msrv:
        name: MSRV (1.88)
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
                with:
                    toolchain: "1.88"
            -   uses: Swatinem/rust-cache@v2
            -   name: Check MSRV
                run: cargo check --all-targets --all-features --workspace

    docs:
        name: Docs
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
            -   uses: Swatinem/rust-cache@v2
            -   name: Check documentation
                env:
                    RUSTDOCFLAGS: -D warnings
                run: cargo doc --no-deps --document-private-items --all-features --workspace --examples

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
                with:
                    components: llvm-tools
            -   uses: Swatinem/rust-cache@v2
            -   name: Install cargo-llvm-cov
                run: cargo install cargo-llvm-cov
            -   name: Run coverage check
                run: cargo llvm-cov --all-features --workspace --fail-under-lines 80

    doctest:
        name: Doctest
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
            -   uses: Swatinem/rust-cache@v2
            -   name: Run doctests
                run: cargo test --doc --workspace --all-features

    public-api:
        name: Public API baseline
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
            -   uses: Swatinem/rust-cache@v2
            -   name: Install cargo-public-api
                # Pinned to the version the committed api-baseline.txt was
                # generated with (text comparison below), so the gate is
                # reproducible across environments.
                run: cargo install cargo-public-api --version 0.52.0 --locked
            -   name: Install nightly toolchain (rustdoc JSON)
                # cargo-public-api builds rustdoc JSON with a nightly rustc; the
                # pinned date matches the toolchain used to generate the
                # committed api-baseline.txt so the -sss text comparison stays
                # stable. Bump the date and regenerate the baseline together.
                uses: dtolnay/rust-toolchain@master
                with:
                    toolchain: nightly-2026-07-25
            -   name: Check public API diff
                env:
                    RUSTUP_TOOLCHAIN: nightly-2026-07-25
                run: cargo public-api --manifest-path Cargo.toml -sss | diff - api-baseline.txt

    deny:
        name: cargo-deny
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
            -   uses: Swatinem/rust-cache@v2
            -   name: Install cargo-deny
                uses: taiki-e/install-action@cargo-deny
            -   name: Run cargo-deny
                run: cargo deny check
