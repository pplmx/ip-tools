[package]
name = "ip-tools"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Network observability and diagnostics: DNS, TCP, TLS, HTTP/1.1, HTTP/2, HTTP/3/QUIC, route and repeated-probe probes with evidence-based diagnosis"
authors = ["Mystic"]
repository = "https://github.com/pplmx/ip-tools"
homepage = "https://github.com/pplmx/ip-tools"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["network", "diagnostics", "dns", "tcp", "tls", "http", "quic", "cli"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "ip_tools"
path = "src/lib.rs"

[[bin]]
name = "ip-tools"
path = "src/main.rs"

[features]
default = []
# Enables the in-process TLS/HTTP fixture server used by integration tests
# (self-signed certificate + local HTTP/1.1, HTTP/2 and HTTP/3 servers).
test-server = ["dep:rcgen", "hyper/server"]

[dependencies]
bytes = "1"
clap = { version = "~4.6.0", features = ["cargo"] }
h2 = "0.4.16"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-resolver = { version = "0.26.1", features = ["serde"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2"
local-ip-address = "~0.6.0"
quinn = { version = "0.11.9", features = ["rustls-ring", "log"] }
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.18.1"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.8"
husky-rs = "0.4"
predicates = "3.1"

[profile.test]
opt-level = 1

[profile.bench]
lto = true
codegen-units = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
